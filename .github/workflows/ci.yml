name: ci

on: [push, pull_request]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: SymPy pour le pont de calcul formel
        run: python3 -m pip install sympy
      - name: Dépendances GTK et WebKit (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev
      - name: Tests du transpileur
        run: cargo test -p docdg-transpiler --release
      - name: Compilation de l'application
        run: cargo build -p docdg --release
      - name: Banc d'essai — non-régression de performance
        run: |
          cargo run -p docdg-bench --release -- exemples/vitrine4.txt 20 50
          cargo run -p docdg-bench --release -- exemples/algo4.txt 20 100

    <div class="groupe" id="g-fichier"><span class="groupe-nom">Fichier</span>
        <button id="btn-load" type="button">Ouvrir</button>
        <button id="btn-save" type="button">Enregistrer</button>
        <button id="btn-export" type="button">Exporter</button>
    </div>
    <div class="groupe" id="g-edition"><span class="groupe-nom">Édition</span>
        <button id="btn-annuler" type="button" title="Annuler (Ctrl+Z)" disabled>↶</button>
        <button id="btn-retablir" type="button" title="Rétablir (Ctrl+Y ou Ctrl+Maj+Z)" disabled>↷</button>
        <button id="btn-settings" type="button">Réglages</button>
    </div>
    <div class="groupe" id="g-vue"><span class="groupe-nom">Vue</span>
        <button id="btn-volet-code" type="button" class="actif" title="Afficher ou masquer le code">Code</button>
        <button id="btn-volet-apercu" type="button" class="actif" title="Afficher ou masquer l'aperçu">Aperçu</button>
        <button id="btn-disposition" type="button" title="Basculer la disposition">⇄</button>
        <button id="btn-zoom-out" type="button" title="Réduire">−</button>
        <button id="btn-zoom-in" type="button" title="Agrandir">+</button>
    </div>
    <span id="spacer"></span>
    <span id="modifie" class="hidden" title="Modifications non enregistrées"></span>
    <span id="echeance" class="hidden"></span>
    <span id="status"></span>
</div>
<div id="settings" class="hidden">
    <fieldset>
        <legend>Document</legend>
        <label>Titre <input type="text" id="doc-titre" placeholder="—"></label>
        <label>Auteur <input type="text" id="doc-auteur" placeholder="—"></label>
        <label>Institution <input type="text" id="doc-institution" placeholder="—"></label>
        <label>Date <input type="text" id="doc-date" placeholder="—"></label>
    </fieldset>
    <label>Orientation
        <select id="set-orientation">
            <option value="portrait">Portrait</option>
            <option value="paysage">Paysage</option>
        </select>
    </label>
    <fieldset>
        <legend>Marges (mm)</legend>
        <label>Haut <input type="number" id="mar-top" min="0" step="any"></label>
        <label>Droite <input type="number" id="mar-right" min="0" step="any"></label>
        <label>Bas <input type="number" id="mar-bottom" min="0" step="any"></label>
        <label>Gauche <input type="number" id="mar-left" min="0" step="any"></label>
    </fieldset>
    <fieldset>
        <legend>Espacements (mm)</legend>
        <label>Haut <input type="number" id="esp-top" min="0" step="any"></label>
        <label>Droite <input type="number" id="esp-right" min="0" step="any"></label>
        <label>Bas <input type="number" id="esp-bottom" min="0" step="any"></label>
        <label>Gauche <input type="number" id="esp-left" min="0" step="any"></label>
    </fieldset>
    <fieldset>
        <legend>Texte</legend>
        <label>Police scripte <input type="text" id="doc-police" placeholder="Georgia, Times…"></label>
        <label>Police manuscrite <input type="text" id="doc-seyes" placeholder="Schola…"></label>
        <label>Math <input type="text" id="doc-math" placeholder="—"></label>
        <label>Taille (pt) <input type="number" id="set-police" min="6" step="any"></label>
        <label>Interligne <input type="number" id="set-interligne" min="1" step="0.05"></label>
    </fieldset>
    <fieldset>
        <legend>Réglages</legend>
        <label>Tabulation (mm) <input type="number" id="doc-tabulation" min="1" step="any"></label>
        <label>Hauteur de ligne (mm) <input type="number" id="doc-hauteur" min="1" step="any"></label>
        <label>Décalage exposants (%) <input type="number" id="doc-decalage" min="0" step="any"></label>
        <label>Précision (décimales, −1 = libre) <input type="number" id="doc-precision" min="-1" step="1"></label>
        <label>Césure française <input type="checkbox" id="doc-cesure"></label>
        <label>Orphelines (lignes en bas de page) <input type="number" id="doc-orphelines" min="1" step="1"></label>
        <label>Veuves (lignes en haut de page) <input type="number" id="doc-veuves" min="1" step="1"></label>
    </fieldset>
    <button id="btn-apply" type="button">Appliquer</button>
</div>
<div id="fermeture" class="hidden">
    <p id="fermeture-question">Quitter docdg&nbsp;?</p>
    <button id="btn-quitter" type="button">Oui</button>
    <button id="btn-rester" type="button">Non</button>
</div>
<div id="diag"></div>
<div id="panneaux" data-disposition="horizontale">
    <div id="volet-code"><label for="editor">Source</label><textarea id="editor" spellcheck="false" placeholder="Saisir des instructions docdg, ou cliquer sur Charger."></textarea></div>
    <div id="separateur" title="Glisser pour redimensionner — double-clic pour rétablir"></div>
    <div id="volet-apercu"><span class="volet-nom">Aperçu</span><div id="preview-wrapper"><div id="pages"></div></div></div>
</div>
<div id="measure"></div>
<style id="printsize"></style>
<script>/*__PREFS__*/</script>
<script>/*__SCRIPT_JS__*/</script>
</body>
</html>

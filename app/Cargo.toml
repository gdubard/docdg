[package]
name = "docdg"
version = "0.1.0"
edition = "2021"

[dependencies]
docdg-transpiler = { path = "../transpiler" }
tao = "0.36.0"
wry = "0.56.0"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
muda = "0.19.3"

[[bin]]
name = "docdg"
path = "src/main.rs"

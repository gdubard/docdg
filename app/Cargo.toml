[package]
name = "docdg"
version = "2.7.0"
edition = "2021"
rust-version.workspace = true

[dependencies]
docdg-transpiler = { path = "../transpiler" }
tao = "0.36.0"
wry = "0.56.0"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
muda = "0.19.3"

[package.metadata.bundle]
name = "docdg"
identifier = "fr.docdg.app"
icon = ["icones/docdg.icns", "icones/docdg.ico", "icones/docdg.png"]
category = "Education"
short_description = "Préparation de documents de mathématiques"

[[bin]]
name = "docdg"
path = "src/main.rs"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

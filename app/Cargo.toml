[package]
name = "docdg"
version = "0.1.0"
edition = "2021"

[dependencies]
docdg-transpiler = { path = "../transpiler" }
tao = "0.35"
wry = "0.55"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = { version = "0.21", default-features = false, features = ["handshake"] }

[[bin]]
name = "docdg"
path = "src/main.rs"
